<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player Sekai</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<script type="importmap">
    {
        "imports": {
            "@material/web/": "https://esm.run/@material/web/"
        }
    }
</script>

<script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
</script>

<style>
:root {
    --md-sys-color-primary: #ebddfe;
    --md-sys-color-on-primary: #4e368b;
    --md-sys-color-background: #beabf5;
    --md-sys-color-on-background: #4f3a7a;
    --md-sys-color-surface: #e3e1f9;
    --md-sys-color-on-surface: #4f3a7a;
    --md-divider-color: #a08cd9;
    /* --md-filled-button-label-text-color: #e3e1f9;
    --md-filled-button-hover-state-layer-color: #e3e1f9;
    --md-filled-button-hover-state-layer-opacity: 1;
    --md-filled-button-container-color: #4f3a7a;
    --md-filled-button-container-color-hover: #a08cd9; */
}

body {
    margin: 0;
    display: flex;
    height: 100vh;
    font-family: Roboto, sans-serif;
    background: var(--md-sys-color-background);
    color: var(--md-sys-color-on-background);
    overflow: hidden;
}

.sidebar {
    width: 250px;
    padding-left: 20px;
    padding-right: 20px;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 500px;
}

.header {
    padding-left: 20px;
    display: flex; 
    flex-direction: row; 
    align-items: center; 
    gap: 10px;
}

.card {
    background: var(--md-sys-color-surface);
    border-radius: 28px;
    overflow: auto;
    flex: 1;
}

md-list {
    padding: 0;
}

md-list-item {
    cursor: pointer;
    width: 100%;
}

md-list-item:hover, md-list-item:focus{
    background: #d6cff5;
}

md-divider {
    --md-divider-color: #a08cd9;
}

md-filled-button {
    margin-left: 20px;
    align-self: center;
}

.player {
    padding: 10px;
    background: #4f3a7a;
}

audio {
    width: 100%;
}

/* Scrollbar */
.card::-webkit-scrollbar {
    width: 10px;
}

.card::-webkit-scrollbar-track {
    background: transparent;
}

.card::-webkit-scrollbar-thumb {
    background: #b9aaf0;
    border-radius: 10px;
}

.card::-webkit-scrollbar-thumb:hover {
    background: #9f8de0;
}

.card {
    scrollbar-color: #b9aaf0 transparent;
}

.charImg {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    padding: 5px;
    object-fit: cover;
    cursor: pointer;
    transition: opacity 0.15s ease, outline 0.15s ease;
}

.charImg:not(.active) {
    opacity: 0.45;
}

.charImg.active {
    outline: 3px solid #4f3a7a;
    opacity: 1;
}

#searchBar {
    margin: 0 0 20px 20px;
    flex: 1;
}

/* Load-more sentinel */
#loadSentinel {
    height: 1px;
}
</style>
</head>

<body>

<div class="sidebar" style="border-right: 2px solid #a08cd9;">
    <h1 class="md-typescale-display-small">PocketSekai</h1>
    <div class="card">
        <md-list>
            <md-list-item data-href="?view=home">Home</md-list-item>
            <md-divider inset></md-divider>
            <md-list-item data-href="?group=ln">Leo/need</md-list-item>
            <md-list-item data-href="?group=mmj">MORE MORE JUMP</md-list-item>
            <md-list-item data-href="?group=vbs">Vivid BAD SQUAD</md-list-item>
            <md-list-item data-href="?group=wxs">Wonderlands x Showtime</md-list-item>
            <md-list-item data-href="?group=n25">Nightcord</md-list-item>
            <md-list-item data-href="?group=vs">Virtual Singers</md-list-item>
        </md-list>
    </div>
</div>

<div class="main">
    <div class="header">
        <md-filled-text-field
            id="searchBar"
            placeholder="Search songs"
            style="max-width: 300px; margin-top: 10px;">
        </md-filled-text-field>

        <div style="width: 90px; text-align: center;">
            <p id="songCount"></p>
        </div>

        <md-checkbox id="checkbox-all"></md-checkbox>
        <label for="checkbox-all">Include all</label>

        <div id="charContainer" style="display:flex; align-items:center; margin-left: auto; padding-right: 20px;">
        </div>

        <md-filled-button id="open-dialog-btn">Open</md-filled-button>
        <md-dialog id="charDialog">
            <div slot="headline">
                Select character(s)
            </div>
            <form slot="content" id="form-id" method="dialog">
                
            </form>
            <div slot="actions">
                <md-filled-button form="form-id">Ok</md-filled-button>
            </div>
        </md-dialog>
    </div>

    <div class="card" style="margin: 5px 20px 20px 20px;">
        <md-list id="songList"></md-list>
        <div id="loadSentinel"></div>
    </div>

    <div class="player">
        <!-- preload="none" avoids fetching audio until actually played -->
        <audio id="player" controls preload="none"></audio>
    </div>
</div>

<div class="sidebar" style="border-left: 2px solid #a08cd9;">
    <h1 class="md-typescale-display-small">Playing</h1>
    
    <div class="card">
        <md-list>
            <md-list-item style="color: #e3e1f9;" id="playTitle">Play a song!</md-list-item>
        </md-list>
    </div>
        
    <div class="card" style="margin-top: 20px; max-height: 475px; overflow-y: scroll;">
        <md-list id="queueList"></md-list>
    </div>
</div>

<script>
// ─── Constants ───────────────────────────────────────
const charMap = {
    ln:  ["ichika", "saki", "honami", "shiho"],
    mmj: ["minori", "haruka", "airi", "shizuku"],
    vbs: ["kohane", "an", "akito", "toya"],
    wxs: ["tsukasa", "emu", "nene", "rui"],
    n25: ["kanade", "mafuyu", "ena", "mizuki"],
};

const PAGE_SIZE = 200; // songs rendered per batch

// ─── State ───────────────────────────────────────
let allSongs = []; // full song list, fetched once
let groupSongs = []; // songs for current group before char filtering

let filteredSongs = [];   // current filtered view
let renderedCount = 0;    // how many songs are currently in the DOM
let activeChars = new Set();
let currentGroup = null;
let queue = [];

// ─── DOM refs ───────────────────────────────────────
const songList      = document.getElementById("songList");
const queueList     = document.getElementById("queueList");
const player        = document.getElementById("player");
const playTitle     = document.getElementById("playTitle");
const songCountEl   = document.getElementById("songCount");
const searchBar     = document.getElementById("searchBar");
const charContainer = document.getElementById("charContainer");
const openDialogBtn = document.getElementById("open-dialog-btn");
const checkboxAll   = document.getElementById("checkbox-all");
const charDialog    = document.getElementById("charDialog");
const sentinel      = document.getElementById("loadSentinel");
const songCard      = document.getElementById("songCard");

// ─── Debounce function ───────────────────────────────────────
function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

// ─── Dialog ───────────────────────────────────────
openDialogBtn.addEventListener("click", () => {
    const dialog = document.getElementById("charDialog");
    dialog.show();
});

// ─── Sidebar Navigation ───────────────────────────────────────
// Intercept sidebar clicks — update URL without reloading
document.querySelectorAll("md-list-item[data-href]").forEach(item => {
    item.addEventListener("click", () => {
        const href = item.getAttribute("data-href");
        history.pushState(null, "", href);
        onNavigate();
    });
});

// Handle browser back/forward
window.addEventListener("popstate", onNavigate);
 
function onNavigate() {
    const params = new URLSearchParams(window.location.search);
    currentGroup = params.get("group");
 
    // Reset char filter when switching groups
    activeChars = new Set();
    const charParam = params.get("chars") || params.get("char");
    if (charParam) charParam.split(",").forEach(c => activeChars.add(c.toLowerCase()));
 
    // Highlight active sidebar link
    const currentHref = window.location.search || "?view=home";
    document.querySelectorAll("md-list-item[data-href]").forEach(item => {
        item.classList.toggle("nav-active", item.getAttribute("data-href") === currentHref);
    });
 
    // Update search bar
    document.getElementById("searchBar").value = "";

    // hide char filter if no group or no chars for group
    const charContainer = document.getElementById("charContainer");
    const btn = document.getElementById("open-dialog-btn");

    if (currentGroup === "vs") {
        charContainer.style.display = "none";
        btn.style.display = "none";
    } else if (!currentGroup || !charMap[currentGroup]?.length) {
        charContainer.style.display = "none";
        btn.style.display = "flex";
    } else {
        charContainer.style.display = "flex";
        btn.style.display = "none";
    }
 
    loadAndRender();
}

// ─── Fetch song (once) ───────────────────────────────────────
async function loadAndRender() {
    if (!allSongs.length) {
        // Show skeleton/loading state while fetching
        songList.innerHTML = "<md-list-item>Loading…</md-list-item>";
        
        try {
            const res = await fetch("/api/songs");
            allSongs = await res.json();
        } catch (error) {
            console.error("Error fetching songs:", error);
            songList.innerHTML = "<md-list-item>Error loading songs</md-list-item>";
            return;
        }
    }
 
    // Filter songs by group
    if (currentGroup) {
        groupSongs = allSongs.filter(song =>
            song.toLowerCase().startsWith(currentGroup.toLowerCase() + "/")
        );
    } else {
        groupSongs = [...allSongs];
    }

    // Store on window so applyFilters can always access it
    window._groupSongs = groupSongs;
 
    renderCharImg();
    applyFilters();
}

// ─── Character Image ───────────────────────────────────────
function renderCharImg() {
    let chars;

    if (currentGroup && charMap[currentGroup]) {
        chars = charMap[currentGroup];
    } else {
        chars = [...new Set(Object.values(charMap).flat())];
    }
 
    if (!chars.length) {
        charContainer.innerHTML = "";
        return;
    }
 
    charContainer.innerHTML = chars.map(char => {
        const isActive = activeChars.has(char);
        return `<img class="charImg ${isActive ? "active" : ""}"
            src="image/${char}.jpg"
            data-char="${char}"
            title="${char}">`;
    }).join("");
 
    charContainer.querySelectorAll(".charImg").forEach(img => {
        img.addEventListener("click", () => toggleChar(img.dataset.char));
    });

    // all group chars in dialog
    const dialog = document.getElementById("charDialog");
    const form = dialog.querySelector("#form-id");

    form.innerHTML = chars.map(char => {
        const isActive = activeChars.has(char);
        return `<img class="charImg ${isActive ? "active" : ""}"
            src="image/${char}.jpg"
            data-char="${char}"
            title="${char}">`;
    }).join("");

    form.querySelectorAll(".charImg").forEach(img => {
        img.addEventListener("click", () => toggleChar(img.dataset.char));
    });
}

function toggleChar(char) {
    if (activeChars.has(char)) {
        activeChars.delete(char);
    } else {
        activeChars.add(char);
    }
 
    // Update both main and dialog images
    document.querySelectorAll(".charImg").forEach(img => {
        img.classList.toggle("active", activeChars.has(img.dataset.char));
    });
 
    // Sync to URL
    const params = new URLSearchParams(window.location.search);
    if (activeChars.size > 0) {
        params.set("chars", [...activeChars].join(","));
    } else {
        params.delete("chars");
    }
    params.delete("char");
    history.replaceState(null, "", "?" + params.toString());
 
    applyFilters();
}

// ─── Filtering ───────────────────────────────────────────────────────────────
checkboxAll.addEventListener("change", applyFilters);
searchBar.addEventListener("input", debounce(applyFilters, 180));

function applyFilters() {
    let songs = [...(window._groupSongs || [])];
 
    if (activeChars.size > 0) {
        const chars = [...activeChars];
        const includeAll = document.getElementById("checkbox-all").checked;
        songs = songs.filter(song => {
            const lower = song.toLowerCase();
            return includeAll
                ? chars.every(c  => lower.includes("/" + c + "/") || lower.includes(c))
                : chars.some(c   => lower.includes("/" + c + "/") || lower.includes(c));
        });
    }
 
    const q = document.getElementById("searchBar").value.toLowerCase();
    if (q) songs = songs.filter(s => s.toLowerCase().includes(q));
 
    filteredSongs = songs;
    renderedCount = 0;
    songList.innerHTML = "";
    songCountEl.textContent = `${songs.length} songs`;

    renderNextBatch();
}

// ─── Incremental rendering ───────────────────────
function renderNextBatch() {
    // If we've rendered all songs, do nothing
    const end = Math.min(renderedCount + PAGE_SIZE, filteredSongs.length);
    if (renderedCount >= filteredSongs.length) return;
 
    // Create a document fragment to minimize reflows
    const frag = document.createDocumentFragment();
 
    // Render the next batch of songs
    for (let i = renderedCount; i < end; i++) {
        const song = filteredSongs[i];
        const label = song.split("/").pop().replace(".mp3", "");
 
        const item = document.createElement("md-list-item");
        item.textContent = label;
        item.dataset.song = song;
        item.dataset.label = label;
        frag.appendChild(item);
 
        if (i < filteredSongs.length - 1) {
            const divider = document.createElement("md-divider");
            divider.setAttribute("inset", "");
            frag.appendChild(divider);
        }
    }
 
    // Append the batch to the DOM and update the rendered count
    songList.appendChild(frag);
    renderedCount = end;
}

// ─── IntersectionObserver for infinite scroll ───────────
// Sentinel element at the end of the list to trigger loading more songs
const io = new IntersectionObserver(entries => {
    // When the sentinel is visible, render the next batch of songs
    if (entries[0].isIntersecting) renderNextBatch();
}, { root: songCard, rootMargin: "200px" });
io.observe(sentinel);

// ─── Event delegation for song list ────────────
songList.addEventListener("click", e => {
    const item = e.target.closest("md-list-item");
    if (!item) return;
 
    const song  = item.dataset.song;
    const label = item.dataset.label;
    if (!song) return;
 
    // Check if the "Q" button area was clicked (md-filled-button is slotted inside)
    const btn = e.target.closest("md-filled-button");
    if (btn) {
        if (btn.hasAttribute("disabled")) return;
        queue.push(song);
        btn.setAttribute("disabled", "");
        btn.textContent = queue.length;
 
        // Append to queue list — no full re-render
        const qItem = document.createElement("md-list-item");
        qItem.textContent = label;
        queueList.appendChild(qItem);
        return;
    }
 
    // Play
    player.src = `/songs/${song}`;
    player.currentTime = 8;
    player.play();
    playTitle.textContent = label;
});

// Inject the Q button lazily when items are stamped (MutationObserver)
// — avoids paying the cost of button creation for off-screen items.
const qBtnObserver = new MutationObserver(mutations => {
    mutations.forEach(m => {
        m.addedNodes.forEach(node => {
            if (node.nodeName === "MD-LIST-ITEM" && node.dataset.song && !node.querySelector("md-filled-button")) {
                const btn = document.createElement("md-filled-button");
                btn.setAttribute("slot", "end");
                btn.textContent = "Q";
                node.appendChild(btn);
            }
        });
    });
});
qBtnObserver.observe(songList, { childList: true });

// ─── Queue: play next on ended ───────────────────────────────────────
player.addEventListener("ended", () => {
    if (queue.length > 0) {
        const next = queue.shift();
        player.src = `/songs/${next}`;
        player.play();
        playTitle.textContent = next.split("/").pop().replace(".mp3", "");
    }
    else {
        playTitle.textContent = "Play a song!";
    }

    // Re-render queue list
    const frag = document.createDocumentFragment();

    // Also re-enable Q buttons for songs that were just played
    queue.forEach(s => {
        const qi = document.createElement("md-list-item");
        qi.textContent = s.split("/").pop().replace(".mp3", "");
        frag.appendChild(qi);
    });

    // Clear and re-populate the queue list
    queueList.innerHTML = "";
    queueList.appendChild(frag);

    // Re-enable all Q buttons since the first song in the queue has been removed
    document.querySelectorAll("#songList md-list-item").forEach(item => {
        const btn = item.querySelector("md-filled-button");
        if (btn) {
            const song = item.dataset.song;
            if (queue.includes(song)) {
                btn.setAttribute("disabled", "");
                btn.textContent = queue.indexOf(song) + 1;
            } else {
                btn.removeAttribute("disabled");
                btn.textContent = "Q";
            }
        }
    });
    
});

onNavigate();
</script>

</body>
</html>
