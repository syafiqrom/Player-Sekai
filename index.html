<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Sekai</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<script type="importmap">
    {
        "imports": {
            "@material/web/": "https://esm.run/@material/web/"
        }
    }
</script>

<script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
</script>

<style>
:root {
    --md-sys-color-primary: #4e368b;
    --md-sys-color-on-primary: #ebddfe;
    --md-sys-color-background: #beabf5;
    --md-sys-color-on-background: #4f3a7a;
    --md-sys-color-surface: #e3e1f9;
    --md-sys-color-on-surface: #4f3a7a;
    --md-divider-color: #a08cd9;
    --sidebar-width: 220px;
    --header-h: 64px;
    --player-h: 64px;
}

*, *::before, *::after { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Roboto, sans-serif;
    background: var(--md-sys-color-background);
    color: var(--md-sys-color-on-background);
    height: 100dvh;
    overflow: hidden;
    display: grid;
    grid-template:
        "left  header  right" var(--header-h)
        "left  main    right" 1fr
        "player player player" var(--player-h)
        / var(--sidebar-width) 1fr var(--sidebar-width);
}

/* ── Sidebars ── */
.sidebar-left  { grid-area: left;  border-right: 2px solid #a08cd9; }
.sidebar-right { grid-area: right; border-left:  2px solid #a08cd9; }

.sidebar-left,
.sidebar-right {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 0 20px;
    background: var(--md-sys-color-background);
    z-index: 10;
}

.sidebar-left h1,
.sidebar-right h1 {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 2rem;
}

.sidebar-right-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-wrap: wrap;
}

/* ── Header ── */
.header {
    grid-area: header;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 20px;
    overflow: hidden;
}

/* ── Main content ── */
.main {
    grid-area: main;
    overflow: hidden;
    padding: 5px 20px 20px;
}

/* ── Player bar ── */
.player {
    grid-area: player;
    background: #4f3a7a;
    display: flex;
    align-items: center;
    padding: 0 8px;
}

audio { width: 100%; height: 50px; }

/* ── Shared card ── */
.card {
    background: var(--md-sys-color-surface);
    border-radius: 20px;
    overflow: auto;
    flex: 1;
    min-height: 0;
}

.sidebar-left  .card { height: calc(100dvh - var(--header-h) - var(--player-h) - 56px); margin-bottom: 20px; }
.sidebar-right .card:first-of-type { flex: 1; min-height: 0; max-height: 50%; }
.sidebar-right .queue-card { flex: 1; min-height: 0; margin-top: 8px; overflow-y: auto; margin-bottom: 20px;}

/* ── Song list card ── */
.main .card { height: 100%; }

md-list { padding: 0; }

md-list-item {
    cursor: pointer;
    width: 100%;
}

md-list-item:hover,
md-list-item:focus { background: #d6cff5; }

md-divider { --md-divider-color: #a08cd9; }

/* ── Search + count ── */
#searchBar {
    flex: 1;
    min-width: 80px;
    max-width: 260px;
    --md-filled-text-field-container-shape: 12px;
}

#songCount {
    white-space: nowrap;
    margin: 0;
}

/* ── Char images ── */
#charContainer {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 2px;
}

.charImg {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    padding: 5px;
    object-fit: cover;
    cursor: pointer;
    transition: opacity .15s, outline .15s;
}

.charImg:not(.active) { opacity: .45; }
.charImg.active { outline: 3px solid #4f3a7a; opacity: 1; }

/* ── Select button ── */
md-filled-button { white-space: nowrap; }

/* ── Autoplay row ── */
.autoplay-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

/* ── Scrollbar ── */
.card::-webkit-scrollbar { width: 8px; }
.card::-webkit-scrollbar-track { background: transparent; }
.card::-webkit-scrollbar-thumb { background: #b9aaf0; border-radius: 8px; }
.card::-webkit-scrollbar-thumb:hover { background: #9f8de0; }
.card { scrollbar-color: #b9aaf0 transparent; }

#loadSentinel { height: 1px; }

/* ── Hamburger / overlay (mobile) ── */
.hamburger {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 20px;
    flex-shrink: 0;
}

.hamburger span {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--md-sys-color-on-background);
    margin: 4px 0;
    border-radius: 2px;
    transition: .2s;
}

.small-btn {
    display: none;
    background: none;
    border: 2px solid #a08cd9;
    border-radius: 20px;
    padding: 4px 12px;
    cursor: pointer;
    color: var(--md-sys-color-on-background);
    font-size: 13px;
    flex-shrink: 0;
}

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    z-index: 9;
}

.overlay.open { display: block; }

/* ── Tablet: hide right sidebar, show queue and search button ── */
@media (max-width: 900px) {
    body {
        grid-template:
            "left  header" var(--header-h)
            "left  main  " 1fr
            "player player" var(--player-h)
            / var(--sidebar-width) 1fr;
    }

    .sidebar-right {
        position: fixed;
        top: 0; right: 0; bottom: var(--player-h);
        width: 240px;
        transform: translateX(100%);
        transition: transform .25s ease;
        border-left: 2px solid #a08cd9;
        padding-top: 12px;
    }

    .sidebar-right.open { transform: translateX(0); }

    .main { padding: 5px 20px 20px; }

    #songCount { display: none; }
    #searchBar { display: none; }
    #searchBtn { display: block; }
    #searchBtn { display: block; }
    #queueBtn  { display: block; }
}

/* ── Mobile: hide left sidebar too, use hamburger ── */
@media (max-width: 600px) {
    :root { --sidebar-width: 0px; }

    body {
        grid-template:
            "header" var(--header-h)
            "main  " 1fr
            "player" var(--player-h)
            / 1fr;
    }

    .sidebar-left {
        position: fixed;
        top: 0; left: 0; bottom: var(--player-h);
        width: 220px;
        transform: translateX(-100%);
        transition: transform .25s ease;
        border-right: 2px solid #a08cd9;
        padding-top: 12px;
        z-index: 11;
    }

    .sidebar-left.open { transform: translateX(0); }

    .hamburger { display: flex; flex-direction: column; }

    .header { gap: 4px; padding: 0 8px; }

    /* search popup */
    #searchPopup {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.4);
        z-index: 100;
        align-items: flex-start;
        justify-content: center;
        padding-top: 80px;
    }
}
</style>
</head>

<body>

<!-- Overlay for mobile drawers -->
<div class="overlay" id="overlay"></div>

<!-- Left sidebar -->
<div class="sidebar-left" id="sidebarLeft">
    <h1 class="md-typescale-display-small">PocketSekai</h1>
    <div class="card">
        <md-list>
            <md-list-item data-href="?view=home">Home</md-list-item>
            <md-divider inset></md-divider>
            <md-list-item data-href="?group=ln">Leo/need</md-list-item>
            <md-list-item data-href="?group=mmj">MORE MORE JUMP</md-list-item>
            <md-list-item data-href="?group=vbs">Vivid BAD SQUAD</md-list-item>
            <md-list-item data-href="?group=wxs">Wonderlands x Showtime</md-list-item>
            <md-list-item data-href="?group=n25">Nightcord</md-list-item>
            <md-list-item data-href="?group=vs">Virtual Singers</md-list-item>
        </md-list>
    </div>
</div>

<!-- Header -->
<div class="header">
    <!-- Hamburger (mobile only) -->
    <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>

    <md-filled-text-field
        id="searchBar"
        placeholder="Search songs">
    </md-filled-text-field>

    <button class="small-btn" id="searchBtn">Search</button>
    <!-- Search popup overlay -->
    <div id="searchPopup">
        <div style="
            background: var(--md-sys-color-surface);
            border-radius: 20px;
            padding: 16px;
            width: 90%;
            max-width: 400px;
            display: flex;
            gap: 8px;
            align-items: center;
        ">
            <md-filled-text-field
                id="searchBarPopup"
                placeholder="Search songs"
                style="flex: 1;">
            </md-filled-text-field>
            <md-filled-button id="closeSearchBtn">Close</md-filled-button>
        </div>
    </div>

    <p id="songCount"></p>

    <div style="margin-left: auto;">
        <md-checkbox id="checkbox-all"></md-checkbox>
    <label for="checkbox-all">All</label>
    </div>
    

    <div id="charContainer"></div>

    <md-filled-button id="open-dialog-btn" style="display:none;">Select</md-filled-button>

    <!-- Queue button (tablet) -->
    <button class="small-btn" id="queueBtn">Queue</button>

    <md-dialog id="charDialog">
        <div slot="headline">Select character(s)</div>
        <form slot="content" id="form-id" method="dialog"></form>
        <div slot="actions">
            <md-filled-button form="form-id">Ok</md-filled-button>
        </div>
    </md-dialog>
</div>

<!-- Main song list -->
<div class="main">
    <div class="card">
        <md-list id="songList"></md-list>
        <div id="loadSentinel"></div>
    </div>
</div>

<!-- Player bar -->
<div class="player">
    <audio id="player" controls preload="none"></audio>
</div>

<!-- Right sidebar -->
<div class="sidebar-right" id="sidebarRight">
    <div class="sidebar-right-top">
        <h1 class="md-typescale-display-small" style="margin:0;">Playing</h1>
        <div class="autoplay-row">
            <label for="auto-switch">Auto</label>
            <md-switch id="auto-switch" selected></md-switch>
        </div>
    </div>

    <div class="card" style="max-height:120px; flex:none; margin-top:8px;">
        <md-list>
            <md-list-item style="color:#e3e1f9;" id="playTitle">Play a song!</md-list-item>
        </md-list>
    </div>

    <div class="card queue-card">
        <md-list id="queueList"></md-list>
    </div>
</div>

<script>
const charMap = {
    ln:  ["ichika","saki","honami","shiho"],
    mmj: ["minori","haruka","airi","shizuku"],
    vbs: ["kohane","an","akito","toya"],
    wxs: ["tsukasa","emu","nene","rui"],
    n25: ["kanade","mafuyu","ena","mizuki"],
};

const PAGE_SIZE = 200;

let allSongs = [];
let groupSongs = [];
let filteredSongs = [];
let renderedCount = 0;
let activeChars = new Set();
let currentGroup = null;
let queue = [];
let currentItem = null;
let currentSongPath = null;

const songList      = document.getElementById("songList");
const queueList     = document.getElementById("queueList");
const player        = document.getElementById("player");
const playTitle     = document.getElementById("playTitle");
const songCountEl   = document.getElementById("songCount");
const searchBar     = document.getElementById("searchBar");
const charContainer = document.getElementById("charContainer");
const openDialogBtn = document.getElementById("open-dialog-btn");
const checkboxAll   = document.getElementById("checkbox-all");
const charDialog    = document.getElementById("charDialog");
const sentinel      = document.getElementById("loadSentinel");
const autoSwitch    = document.getElementById("auto-switch");
const overlay       = document.getElementById("overlay");
const sidebarLeft   = document.getElementById("sidebarLeft");
const sidebarRight  = document.getElementById("sidebarRight");
const hamburgerBtn  = document.getElementById("hamburgerBtn");
const queueBtn      = document.getElementById("queueBtn");

// Search popup
const searchBtn = document.getElementById("searchBtn");
const searchPopup = document.getElementById("searchPopup");
const closeSearchBtn = document.getElementById("closeSearchBtn");
const searchBarPopup = document.getElementById("searchBarPopup");

// ── Search Popup ──────────────────────────────────
searchBtn.addEventListener("click", () => {
    searchPopup.style.display = "flex";
    searchBarPopup.focus();
});

closeSearchBtn.addEventListener("click", () => {
    searchPopup.style.display = "none";
});

// Close on backdrop click
searchPopup.addEventListener("click", (e) => {
    if (e.target === searchPopup) searchPopup.style.display = "none";
});

// Wire popup search bar to the same filter logic
searchBarPopup.addEventListener("input", debounce(() => {
    searchBar.value = searchBarPopup.value;
    applyFilters();
}, 180));

window.addEventListener("resize", () => {
    if (window.innerWidth > 600) {
        searchPopup.style.display = "none";
        searchBar.style.display = "";      // show main search bar
        searchBtn.style.display = "none";  // hide search button
    } else {
        searchBar.style.display = "none";  // hide main search bar
        searchBtn.style.display = "";      // show search button
    }
});

// ── Drawer helpers ──────────────────────────────────
function openDrawer(el) {
    el.classList.add("open");
    overlay.classList.add("open");
}

function closeDrawers() {
    sidebarLeft.classList.remove("open");
    sidebarRight.classList.remove("open");
    overlay.classList.remove("open");
}

hamburgerBtn.addEventListener("click", () => {
    if (sidebarLeft.classList.contains("open")) closeDrawers();
    else openDrawer(sidebarLeft);
});

queueBtn.addEventListener("click", () => {
    if (sidebarRight.classList.contains("open")) closeDrawers();
    else openDrawer(sidebarRight);
});

overlay.addEventListener("click", closeDrawers);

// Close drawers on nav click (mobile)
document.querySelectorAll("md-list-item[data-href]").forEach(item => {
    item.addEventListener("click", () => {
        closeDrawers();
        history.pushState(null, "", item.getAttribute("data-href"));
        onNavigate();
    });
});

// ── Utilities ──────────────────────────────────────
function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function playSong(song) {
    currentSongPath = song;
    player.src = `/songs/${song}`;
    player.currentTime = 8;
    player.play();
    playTitle.textContent = song.split("/").pop().replace(".mp3", "");
    styleCurrentItem();
}

function styleCurrentItem() {
    if (!currentItem) return;
    currentItem.setAttribute("disabled", "");
    currentItem.style.color = "#b9aaf0";
    currentItem.style.backgroundColor = "#d6cff5";
}

// ── Dialog ─────────────────────────────────────────
openDialogBtn.addEventListener("click", () => charDialog.show());

window.addEventListener("popstate", onNavigate);

function onNavigate() {
    const params = new URLSearchParams(window.location.search);
    currentGroup = params.get("group");

    activeChars = new Set();
    const charParam = params.get("chars") || params.get("char");
    if (charParam) charParam.split(",").forEach(c => activeChars.add(c.toLowerCase()));

    const currentHref = window.location.search || "?view=home";
    document.querySelectorAll("md-list-item[data-href]").forEach(item => {
        item.classList.toggle("nav-active", item.getAttribute("data-href") === currentHref);
    });

    searchBar.value = "";

    if (currentGroup === "vs") {
        charContainer.style.display = "none";
        openDialogBtn.style.display = "none";
    } else if (!currentGroup || !charMap[currentGroup]?.length) {
        charContainer.style.display = "none";
        openDialogBtn.style.display = "flex";
    } else {
        charContainer.style.display = "flex";
        openDialogBtn.style.display = "none";
    }

    loadAndRender();
}

async function loadAndRender() {
    if (!allSongs.length) {
        songList.innerHTML = "<md-list-item>Loading…</md-list-item>";
        try {
            const res = await fetch("/api/songs");
            allSongs = await res.json();
        } catch (e) {
            songList.innerHTML = "<md-list-item>Error loading songs</md-list-item>";
            return;
        }
    }

    if (currentGroup) {
        groupSongs = allSongs.filter(s => s.toLowerCase().startsWith(currentGroup.toLowerCase() + "/"));
    } else {
        groupSongs = [...allSongs].sort((a, b) =>
            a.split("/").pop().toLowerCase().localeCompare(b.split("/").pop().toLowerCase()));
    }

    window._groupSongs = groupSongs;
    renderCharImg();
    applyFilters();
}

function renderCharImg() {
    const chars = (currentGroup && charMap[currentGroup])
        ? charMap[currentGroup]
        : [...new Set(Object.values(charMap).flat())];

    if (!chars.length) { charContainer.innerHTML = ""; return; }

    const imgHTML = chars.map(char =>
        `<img class="charImg ${activeChars.has(char) ? "active" : ""}"
            src="image/${char}.jpg" data-char="${char}" title="${char}">`
    ).join("");

    charContainer.innerHTML = imgHTML;
    charContainer.querySelectorAll(".charImg").forEach(img =>
        img.addEventListener("click", () => toggleChar(img.dataset.char)));

    const form = document.getElementById("form-id");
    form.innerHTML = imgHTML;
    form.querySelectorAll(".charImg").forEach(img =>
        img.addEventListener("click", () => toggleChar(img.dataset.char)));
}

function toggleChar(char) {
    if (activeChars.has(char)) activeChars.delete(char);
    else activeChars.add(char);

    document.querySelectorAll(".charImg").forEach(img =>
        img.classList.toggle("active", activeChars.has(img.dataset.char)));

    const params = new URLSearchParams(window.location.search);
    if (activeChars.size > 0) params.set("chars", [...activeChars].join(","));
    else params.delete("chars");
    params.delete("char");
    history.replaceState(null, "", "?" + params.toString());
    applyFilters();
}

checkboxAll.addEventListener("change", applyFilters);
searchBar.addEventListener("input", debounce(applyFilters, 180));

function applyFilters() {
    let songs = [...(window._groupSongs || [])];

    if (activeChars.size > 0) {
        const chars = [...activeChars];
        const includeAll = checkboxAll.checked;
        songs = songs.filter(song => {
            const lower = song.toLowerCase();
            return includeAll
                ? chars.every(c => lower.includes("/" + c + "/") || lower.includes(c))
                : chars.some(c  => lower.includes("/" + c + "/") || lower.includes(c));
        });
    }

    const q = searchBar.value.toLowerCase();
    if (q) songs = songs.filter(s => s.toLowerCase().includes(q));

    filteredSongs = songs;
    renderedCount = 0;
    songList.innerHTML = "";
    songCountEl.textContent = `${songs.length} songs`;
    renderNextBatch();
}

function renderNextBatch() {
    const end = Math.min(renderedCount + PAGE_SIZE, filteredSongs.length);
    if (renderedCount >= filteredSongs.length) return;

    const frag = document.createDocumentFragment();

    for (let i = renderedCount; i < end; i++) {
        const song = filteredSongs[i];
        const label = song.split("/").pop().replace(".mp3", "");

        const item = document.createElement("md-list-item");
        item.textContent = label;
        item.dataset.song = song;
        item.dataset.label = label;
        frag.appendChild(item);

        if (i < filteredSongs.length - 1) {
            const divider = document.createElement("md-divider");
            divider.setAttribute("inset", "");
            frag.appendChild(divider);
        }
    }

    songList.appendChild(frag);
    renderedCount = end;

    if (currentSongPath) {
        const item = songList.querySelector(`md-list-item[data-song="${CSS.escape(currentSongPath)}"]`);
        if (item) { currentItem = item; styleCurrentItem(); }
    }
}

const io = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) renderNextBatch();
}, { rootMargin: "200px" });
io.observe(sentinel);

songList.addEventListener("click", e => {
    const item = e.target.closest("md-list-item");
    if (!item) return;

    const song  = item.dataset.song;
    const label = item.dataset.label;
    if (!song) return;

    const btn = e.target.closest("md-filled-button");
    if (btn) {
        if (btn.hasAttribute("disabled")) return;
        queue.push(song);
        btn.setAttribute("disabled", "");
        btn.textContent = queue.length;
        const qItem = document.createElement("md-list-item");
        qItem.textContent = label;
        queueList.appendChild(qItem);
        return;
    }

    if (currentItem) {
        currentItem.removeAttribute("disabled");
        currentItem.style.color = "";
        currentItem.style.backgroundColor = "";
    }

    currentItem = item;
    playSong(song);
});

const qBtnObserver = new MutationObserver(mutations => {
    mutations.forEach(m => {
        m.addedNodes.forEach(node => {
            if (node.nodeName === "MD-LIST-ITEM" && node.dataset.song && !node.querySelector("md-filled-button")) {
                const btn = document.createElement("md-filled-button");
                btn.setAttribute("slot", "end");
                btn.textContent = "Q";
                node.appendChild(btn);
            }
        });
    });
});
qBtnObserver.observe(songList, { childList: true });

player.addEventListener("ended", () => {
    if (currentItem) {
        currentItem.removeAttribute("disabled");
        currentItem.style.color = "";
        currentItem.style.backgroundColor = "";
    }

    if (queue.length > 0) {
        const next = queue.shift();
        currentItem = songList.querySelector(`md-list-item[data-song="${CSS.escape(next)}"]`);
        if (currentItem) playSong(next);
    } else if (autoSwitch.selected && currentItem) {
        let next = currentItem.nextElementSibling;
        while (next && next.tagName !== "MD-LIST-ITEM") next = next.nextElementSibling;
        if (next && next.dataset.song) {
            currentItem = next;
            playSong(next.dataset.song);
            return;
        }
    } else {
        currentItem = null;
        playTitle.textContent = "Play a song!";
    }

    const frag = document.createDocumentFragment();
    queue.forEach(s => {
        const qi = document.createElement("md-list-item");
        qi.textContent = s.split("/").pop().replace(".mp3", "");
        frag.appendChild(qi);
    });
    queueList.innerHTML = "";
    queueList.appendChild(frag);

    document.querySelectorAll("#songList md-list-item").forEach(item => {
        const btn = item.querySelector("md-filled-button");
        if (!btn) return;
        const s = item.dataset.song;
        if (queue.includes(s)) {
            btn.setAttribute("disabled", "");
            btn.textContent = queue.indexOf(s) + 1;
        } else {
            btn.removeAttribute("disabled");
            btn.textContent = "Q";
        }
    });
});

onNavigate();
</script>
</body>
</html>
