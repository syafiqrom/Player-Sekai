<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sekaiplayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f5f3ef;
    --surface:   #ffffff;
    --border:    #e2ddd6;
    --text:      #1a1814;
    --muted:     #8a8479;
    --accent:    #c9625f;
    --player-bg: #1a1814;
    --player-fg: #f5f3ef;
    --player-muted: rgba(245,243,239,.38);
    --player-sub:   rgba(245,243,239,.45);
    --player-track: rgba(245,243,239,.13);
    --tag-bg:    #ede9e3;
    --tag-text:  #5a5550;
    --transition: .18s ease;
  }
  [data-theme="dark"] {
    --bg:        #131210;
    --surface:   #1e1c19;
    --border:    #2e2b27;
    --text:      #f0ece4;
    --muted:     #6b6660;
    --accent:    #e07570;
    --player-bg: #0d0c0a;
    --player-fg: #f0ece4;
    --player-muted: rgba(240,236,228,.38);
    --player-sub:   rgba(240,236,228,.45);
    --player-track: rgba(240,236,228,.13);
    --tag-bg:    #2a2723;
    --tag-text:  #9a9590;
  }
  [data-theme="light"] {
    --player-bg: #f0ece4;
    --player-fg: #1a1814;
    --player-muted: rgba(26,24,20,.35);
    --player-sub:   rgba(26,24,20,.45);
    --player-track: rgba(26,24,20,.12);
  }
  [data-accent="rose"]   { --accent:#c9625f; }
  [data-accent="sage"]   { --accent:#5a8a6a; }
  [data-accent="indigo"] { --accent:#5c68c0; }
  [data-accent="amber"]  { --accent:#c08030; }
  [data-accent="plum"]   { --accent:#8a5090; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    transition: background var(--transition), color var(--transition);
    overflow: hidden;
  }

  /* ── HEADER ──────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
    transition: background var(--transition), border-color var(--transition);
  }
  header h1 { font-family: 'DM Serif Display', serif; font-size: 1.2rem; flex: 1; }
  header h1 span { color: var(--accent); }
  .header-actions { display: flex; gap: 6px; align-items: center; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 7px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--tag-bg); color: var(--text); }
  .icon-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .header-sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }

  /* ── THEME POPOVER ───────────────────────────────────── */
  .theme-popover { position: relative; }
  .theme-panel {
    display: none; position: absolute; top: calc(100% + 8px); right: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
    flex-direction: column; gap: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.1); z-index: 300; min-width: 148px;
  }
  .theme-panel.open { display: flex; }
  .theme-panel label { font-size: .62rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
  .accent-swatches { display: flex; gap: 7px; }
  .swatch { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform .15s; }
  .swatch:hover { transform: scale(1.2); }
  .swatch.active { border-color: var(--text); }
  .swatch[data-v="rose"]   { background:#c9625f; }
  .swatch[data-v="sage"]   { background:#5a8a6a; }
  .swatch[data-v="indigo"] { background:#5c68c0; }
  .swatch[data-v="amber"]  { background:#c08030; }
  .swatch[data-v="plum"]   { background:#8a5090; }

  /* ── SPLASH ──────────────────────────────────────────── */
  #splash {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; padding: 40px; text-align: center;
  }
  .spin { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #splash h2 { font-family: 'DM Serif Display', serif; font-size: 1.1rem; }
  #splash p { color: var(--muted); font-size: .76rem; max-width: 380px; line-height: 1.65; }
  code { background: var(--tag-bg); padding: 1px 5px; border-radius: 4px; font-size: .73rem; color: var(--accent); }

  /* ── APP LAYOUT ──────────────────────────────────────── */
  #app { display: none; flex: 1; flex-direction: column; min-height: 0; }
  #app.visible { display: flex; }
  .app-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }

  /* ── SIDEBAR ─────────────────────────────────────────── */
  .sidebar {
    width: 214px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex; flex-direction: column; overflow-y: auto;
    transition: background var(--transition), border-color var(--transition);
  }
  .sidebar-section { padding: 12px 10px 8px; }
  .sidebar-section + .sidebar-section { border-top: 1px solid var(--border); }
  .sidebar-label { font-size: .6rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 5px; padding: 0 4px; }
  .filter-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 7px;
    cursor: pointer; font-size: .75rem; color: var(--muted);
    transition: background .12s, color .12s; user-select: none;
  }
  .filter-item:hover { background: var(--tag-bg); color: var(--text); }
  .filter-item.active { background: var(--accent); color: #fff; }
  .filter-item .count { margin-left: auto; font-size: .6rem; background: rgba(0,0,0,.07); padding: 1px 5px; border-radius: 4px; }
  .filter-item.active .count { background: rgba(255,255,255,.2); }
  .char-controls { display: flex; flex-direction: column; gap: 5px; margin-bottom: 5px; }
  .char-search {
    width: 100%; padding: 6px 10px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--tag-bg);
    color: var(--text); font-family: 'DM Mono', monospace;
    font-size: .73rem; outline: none; transition: border-color .15s;
  }
  .char-search:focus { border-color: var(--accent); }
  .only-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 7px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: .67rem; cursor: pointer; width: 100%;
    transition: background .12s, color .12s, border-color .12s;
  }
  .only-btn:hover { background: var(--tag-bg); color: var(--text); }
  .only-btn.active { background: color-mix(in srgb, var(--accent) 12%, var(--tag-bg)); color: var(--accent); border-color: var(--accent); }
  .clear-item { color: var(--accent) !important; font-size: .71rem; border-bottom: 1px solid var(--border); border-radius: 0 !important; margin-bottom: 4px; padding-bottom: 9px; }
  .clear-item:hover { background: color-mix(in srgb, var(--accent) 8%, var(--tag-bg)) !important; }

  /* ── CONTENT ─────────────────────────────────────────── */
  .content { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

  /* ── TOOLBAR ─────────────────────────────────────────── */
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
    transition: background var(--transition), border-color var(--transition);
  }
  .search-wrap { flex: 1; position: relative; min-width: 0; }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); }
  #search {
    width: 100%; padding: 7px 9px 7px 30px;
    border-radius: 7px; border: 1px solid var(--border);
    background: var(--tag-bg); color: var(--text);
    font-family: 'DM Mono', monospace; font-size: .77rem; outline: none;
    transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }

  /* Sort dropdown */
  .sort-wrap { position: relative; flex-shrink: 0; }
  .sort-display {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 10px; border-radius: 7px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: .68rem; cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
    user-select: none;
  }
  .sort-display:hover { background: var(--tag-bg); color: var(--text); }
  .sort-display.open { border-color: var(--accent); color: var(--accent); }
  .sort-arrow { font-size: .6rem; transition: transform .15s; }
  .sort-display.open .sort-arrow { transform: rotate(180deg); }
  .sort-dropdown {
    display: none; position: absolute; top: calc(100% + 5px); right: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; padding: 5px;
    box-shadow: 0 4px 16px rgba(0,0,0,.1); z-index: 200;
    min-width: 180px;
  }
  .sort-dropdown.open { display: block; }
  .sort-group-label { font-size: .58rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 6px 10px 3px; }
  .sort-option {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: 6px; cursor: pointer;
    font-size: .74rem; color: var(--muted);
    transition: background .1s, color .1s;
  }
  .sort-option:hover { background: var(--tag-bg); color: var(--text); }
  .sort-option.active { color: var(--accent); }
  .sort-option .sort-dir { font-size: .65rem; color: var(--muted); }
  .sort-option.active .sort-dir { color: var(--accent); }

  /* View toggle */
  .view-btns { display: flex; gap: 3px; }

  /* Results info */
  .results-info { font-size: .66rem; color: var(--muted); padding: 6px 14px 0; flex-shrink: 0; }

  /* ── SHARED TAG STYLES ───────────────────────────────── */
  .tag { font-size: .58rem; padding: 2px 6px; border-radius: 4px; background: var(--tag-bg); color: var(--tag-text); white-space: nowrap; }
  .unit-light_sound    { --u:#c9625f; }
  .unit-idol           { --u:#e07080; }
  .unit-school_refusal { --u:#7080d0; }
  .unit-street         { --u:#50a0a0; }
  .unit-theme_park     { --u:#d09040; }
  .unit-piapro         { --u:#8a8479; }
  .unit-mix            { --u:#9a70b0; }
  .tag.unit { background: color-mix(in srgb, var(--u,var(--accent)) 13%, var(--tag-bg)); color: var(--u,var(--accent)); }

  /* ── LIST VIEW ───────────────────────────────────────── */
  #song-list { flex: 1; overflow-y: auto; padding: 4px 8px 96px; }
  .song-row {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 9px; border-radius: 8px; cursor: pointer;
    transition: background .12s; position: relative;
  }
  .song-row:hover { background: var(--tag-bg); }
  .song-row.playing { background: var(--tag-bg); }
  .song-row.playing::before { content: ''; position: absolute; left: 0; top: 22%; bottom: 22%; width: 3px; border-radius: 2px; background: var(--accent); }
  .song-num { width: 22px; text-align: right; font-size: .67rem; color: var(--muted); flex-shrink: 0; }
  .song-row.playing .song-num { color: var(--accent); }
  .playing-anim { display: none; align-items: flex-end; gap: 2px; height: 13px; width: 22px; justify-content: flex-end; }
  .song-row.playing .playing-anim { display: flex; }
  .song-row.playing .song-num-text { display: none; }
  .bar { width: 3px; border-radius: 2px; background: var(--accent); animation: bounce .8s ease infinite; }
  .bar:nth-child(2) { animation-delay:.15s; }
  .bar:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,100%{height:3px} 50%{height:11px} }

  /* Jacket thumbnail in list view */
  .row-jacket {
    width: 40px; height: 40px; border-radius: 6px;
    object-fit: cover; flex-shrink: 0;
    background: var(--tag-bg);
  }
  .row-jacket-placeholder {
    width: 40px; height: 40px; border-radius: 6px;
    background: var(--tag-bg); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: .9rem; color: var(--muted);
  }

  .song-info { flex: 1; min-width: 0; }
  .song-title { font-size: .82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); margin-bottom: 3px; }
  .song-row.playing .song-title { color: var(--accent); }
  .song-meta { display: flex; gap: 5px; flex-wrap: wrap; }

  /* ── GRID VIEW ───────────────────────────────────────── */
  #song-list.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
    padding: 14px 14px 100px;
    align-content: start;
  }
  .song-card {
    border-radius: 10px; cursor: pointer;
    background: var(--surface);
    border: 1px solid var(--border);
    overflow: hidden;
    transition: transform .15s, box-shadow .15s, border-color .15s;
    position: relative;
  }
  .song-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.1); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .song-card.playing { border-color: var(--accent); }
  .song-card.playing::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--accent); border-radius: 0;
  }

  .card-jacket-wrap { position: relative; width: 100%; aspect-ratio: 1; overflow: hidden; background: var(--tag-bg); }
  .card-jacket { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  .song-card:hover .card-jacket { transform: scale(1.04); }
  .card-jacket-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--muted); }

  /* Play overlay on card */
  .card-play-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.35); opacity: 0;
    transition: opacity .15s;
  }
  .song-card:hover .card-play-overlay { opacity: 1; }
  .song-card.playing .card-play-overlay { opacity: 1; background: rgba(0,0,0,.45); }
  .card-play-icon {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: .95rem;
  }
  .card-playing-anim {
    display: none; align-items: flex-end; gap: 3px; height: 16px;
  }
  .song-card.playing .card-playing-anim { display: flex; }
  .song-card.playing .card-play-icon-default { display: none; }
  .card-bar { width: 4px; border-radius: 2px; background: #fff; animation: bounce .8s ease infinite; }
  .card-bar:nth-child(2) { animation-delay:.15s; }
  .card-bar:nth-child(3) { animation-delay:.3s; }

  .card-body { padding: 9px 10px 10px; }
  .card-title { font-size: .78rem; font-weight: 500; color: var(--text); margin-bottom: 5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .song-card.playing .card-title { color: var(--accent); }
  .card-meta { display: flex; gap: 4px; flex-wrap: wrap; }
  .card-chars { font-size: .6rem; color: var(--muted); margin-top: 4px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* ── PLAYER BAR ──────────────────────────────────────── */
  #player-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--player-bg); color: var(--player-fg);
    padding: 0 20px; height: 76px;
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 16px;
    z-index: 200; border-top: 1px solid var(--border);
    transition: background var(--transition), color var(--transition), border-color var(--transition);
  }
  #player-bar.hidden { display: none; }
  .np-info { min-width: 0; display: flex; align-items: center; gap: 10px; }
  .np-jacket { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: color-mix(in srgb, var(--player-fg) 10%, transparent); }
  .np-jacket-ph { width: 44px; height: 44px; border-radius: 6px; flex-shrink: 0; background: color-mix(in srgb, var(--player-fg) 10%, transparent); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
  .np-text { min-width: 0; }
  .np-title { font-size: .83rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--player-fg); margin-bottom: 2px; transition: color var(--transition); }
  .np-sub { font-size: .64rem; color: var(--player-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color var(--transition); }
  .player-center { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .controls { display: flex; align-items: center; gap: 6px; }
  .ctrl-btn {
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: color-mix(in srgb, var(--player-fg) 10%, transparent);
    color: color-mix(in srgb, var(--player-fg) 60%, transparent);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: .88rem; transition: background .15s, color .15s;
  }
  .ctrl-btn:hover { background: color-mix(in srgb, var(--player-fg) 20%, transparent); color: var(--player-fg); }
  .ctrl-btn.play-pause { width: 40px; height: 40px; background: var(--accent); color: #fff; font-size: 1rem; }
  .ctrl-btn.play-pause:hover { opacity: .85; }
  .ctrl-btn.shuffle-on { color: var(--accent) !important; }
  .progress-wrap { display: flex; align-items: center; gap: 8px; width: 300px; }
  .time { font-size: .63rem; color: var(--player-muted); font-variant-numeric: tabular-nums; min-width: 30px; transition: color var(--transition); }
  #progress {
    flex: 1; height: 4px; -webkit-appearance: none; appearance: none;
    background: var(--player-track); border-radius: 2px; cursor: pointer; outline: none;
    transition: background var(--transition);
  }
  #progress::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); cursor: pointer; }
  #progress::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--accent); cursor: pointer; border: none; }
  .volume-wrap { display: flex; align-items: center; gap: 7px; justify-content: flex-end; }
  #volume {
    width: 70px; height: 3px; -webkit-appearance: none; appearance: none;
    background: var(--player-track); border-radius: 2px; cursor: pointer; outline: none;
    transition: background var(--transition);
  }
  #volume::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: color-mix(in srgb, var(--player-fg) 55%, transparent); cursor: pointer; }
  .vol-icon { font-size: .78rem; color: var(--player-muted); }

  /* ── MISC ─────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 200px; gap: 8px; color: var(--muted); font-size: .77rem; }
  .empty .icon { font-size: 2rem; }
</style>
</head>
<body data-theme="light" data-accent="rose">

<!-- HEADER -->
<header>
  <h1>♪ <span>sekai</span>player</h1>
  <div class="header-actions">
    <!-- View toggle -->
    <div class="view-btns">
      <button class="icon-btn active" id="view-list" title="List view">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
          <circle cx="3" cy="6" r="1" fill="currentColor" stroke="none"/>
          <circle cx="3" cy="12" r="1" fill="currentColor" stroke="none"/>
          <circle cx="3" cy="18" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button class="icon-btn" id="view-grid" title="Grid view">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </button>
    </div>
    <div class="header-sep"></div>
    <!-- Dark/light -->
    <button class="icon-btn" id="theme-toggle" title="Toggle dark / light">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
    <!-- Colour theme -->
    <div class="theme-popover">
      <button class="icon-btn" id="palette-btn" title="Colour theme">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8z"/>
          <circle cx="6.5" cy="11.5" r="1.5"/><circle cx="9.5" cy="7.5" r="1.5"/>
          <circle cx="14.5" cy="7.5" r="1.5"/><circle cx="17.5" cy="11.5" r="1.5"/>
        </svg>
      </button>
      <div class="theme-panel" id="theme-panel">
        <label>Accent colour</label>
        <div class="accent-swatches">
          <div class="swatch active" data-v="rose"   title="Rose"></div>
          <div class="swatch"        data-v="sage"   title="Sage"></div>
          <div class="swatch"        data-v="indigo" title="Indigo"></div>
          <div class="swatch"        data-v="amber"  title="Amber"></div>

    </div>
  </div>
</header>

<!-- SPLASH -->
<div id="splash">
  <div class="spin"></div>
  <h2>Loading library…</h2>
  <p id="splash-msg">Fetching JSON data and building song list.</p>
</div>

<!-- APP -->
<div id="app">
  <div class="app-body">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Folder / Unit</div>
        <div id="unit-filters"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Artist / Character</div>
        <div class="char-controls">
          <input type="text" class="char-search" id="char-search" placeholder="Search artists…">
          <button class="only-btn" id="only-chosen-btn" title="Only show songs where all artists are chosen">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            Only chosen
          </button>
        </div>
        <div id="char-filters"></div>
      </div>
    </aside>

    <!-- CONTENT -->
    <div class="content">
      <div class="toolbar">
        <div class="search-wrap">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="search" placeholder="Search songs…">
        </div>
        <!-- Sort dropdown -->
        <div class="sort-wrap">
          <div class="sort-display" id="sort-display">
            <span id="sort-label">Title ↑</span>
            <span class="sort-arrow">▾</span>

          <div class="sort-dropdown" id="sort-dropdown">
            <div class="sort-group-label">Sort by</div>
            <div class="sort-option" data-sort="title"    data-dir="asc">Title <span class="sort-dir">A → Z</span></div>
            <div class="sort-option" data-sort="title"    data-dir="desc">Title <span class="sort-dir">Z → A</span></div>
            <div class="sort-option" data-sort="musicId"  data-dir="asc">Music ID <span class="sort-dir">0 → 9</span></div>
            <div class="sort-option" data-sort="musicId"  data-dir="desc">Music ID <span class="sort-dir">9 → 0</span></div>
            <div class="sort-option" data-sort="released" data-dir="asc">Released <span class="sort-dir">oldest</span></div>
            <div class="sort-option" data-sort="released" data-dir="desc">Released <span class="sort-dir">newest</span></div>
            <div class="sort-option" data-sort="folder"   data-dir="asc">Folder <span class="sort-dir">A → Z</span></div>
            <div class="sort-option" data-sort="folder"   data-dir="desc">Folder <span class="sort-dir">Z → A</span></div>

        </div>

      <div class="results-info" id="results-info"></div>

    </div>

<!-- PLAYER BAR -->
<div id="player-bar" class="hidden">
  <div class="np-info">
    <img class="np-jacket" id="np-jacket" src="" alt="" style="display:none">
    <div class="np-jacket-ph" id="np-jacket-ph">🎵</div>
    <div class="np-text">
      <div class="np-title" id="np-title">—</div>
      <div class="np-sub"   id="np-sub">—</div>
    </div>
  </div>
  <div class="player-center">
    <div class="controls">
      <button class="ctrl-btn" id="btn-prev">&#9664;&#9664;</button>
      <button class="ctrl-btn play-pause" id="btn-play">&#9654;</button>
      <button class="ctrl-btn" id="btn-next">&#9654;&#9654;</button>
      <button class="ctrl-btn" id="btn-shuffle" title="Shuffle">&#8635;</button>
    </div>
    <div class="progress-wrap">
      <span class="time" id="time-cur">0:00</span>
      <input type="range" id="progress" min="0" max="1000" value="0" step="1">
      <span class="time" id="time-dur">0:00</span>
    </div>
  </div>
  <div class="volume-wrap">
    <span class="vol-icon">🔊</span>
    <input type="range" id="volume" min="0" max="1" value="0.8" step="0.01">
  </div>
</div>

<audio id="audio-el"></audio>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────────────
const JSON_FILES = {
  musics:            'musics.json',
  musicVocals:       'musicVocals.json',
  gameCharacters:    'gameCharacters.json',
  outsideCharacters: 'outsideCharacters.json',
};
const AUDIO_DIR  = 'audio';    // contains unit subfolders
const AUDIO_EXT  = 'flac';
const JACKET_DIR = 'jackets';  // jackets/{assetbundleName}.webp
const JACKET_EXT = 'webp';

const UNIT_LABELS = {
  light_sound:     'Leo/need',
  idol:            'MORE MORE JUMP!',
  school_refusal:  'Wonderlands×Showtime',
  street:          '25-ji, Nightcord de.',
  theme_park:      'Vivid BAD SQUAD',
  piapro:          'Virtual Singers',
  mix:             'Mix / Collab',
};
const unitLabel = u => UNIT_LABELS[u] || u;

// ── STATE ──────────────────────────────────────────────────────────────────
const S = {
  songs: [], filtered: [],
  activeUnit: 'all', activeChars: new Set(), onlyChosen: false,
  searchQ: '', sortBy: 'title', sortDir: 'asc',
  view: 'list',                   // 'list' | 'grid'
  currentIdx: -1, shuffle: false, shuffleOrder: [],
};

// ── BOOT ───────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const [musics, vocalsRaw, gameCharsRaw, outsideCharsRaw] = await Promise.all(
      Object.values(JSON_FILES).map(path =>
        fetch(path).then(r => {
          if (!r.ok) throw new Error(`Failed to load "${path}" — ${r.status} ${r.statusText}`);
          return r.json();
        })
      )
    );

    const charMap        = Object.fromEntries(gameCharsRaw.map(c => [c.id, c]));
    const outsideCharMap = Object.fromEntries(outsideCharsRaw.map(c => [c.id, c]));
    const vocalsMap      = {};
    vocalsRaw.forEach(v => { (vocalsMap[v.musicId] ??= []).push(v); });

    musics.forEach(m => {
      (vocalsMap[m.id] || []).forEach(v => {
        const gc = (v.characters || [])
          .filter(c => c.characterType === 'game_character')
          .map(c => charMap[c.characterId]).filter(Boolean);
        const oc = (v.characters || [])
          .filter(c => c.characterType === 'outside_character')
          .map(c => outsideCharMap[c.characterId]).filter(Boolean);

        const charNames = [
          ...gc.map(c => `${c.firstName} ${c.givenName}`),
          ...oc.map(c => c.name),
        ];

        const units = [...new Set(gc.map(c => c.unit))];
        const nonPiapro = units.filter(u => u !== 'piapro');
        const folder = nonPiapro.length === 0 ? 'piapro'
                     : nonPiapro.length === 1 ? nonPiapro[0]
                     : 'mix';

        S.songs.push({
          id:              `${m.id}_${v.id}`,
          musicId:         m.id,
          title:           m.title,
          caption:         v.caption || '',
          jacketSrc:       `${JACKET_DIR}/${m.assetbundleName}.${JACKET_EXT}`,
          folder,
          audioSrc:        `${AUDIO_DIR}/${folder}/${v.assetbundleName}.${AUDIO_EXT}`,
          charNames,
          releasedAt:      m.releasedAt || m.publishedAt || 0,
        });
      });
    });

    sortAndFilter();
    document.getElementById('splash').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    renderSidebarUnits();
    renderSidebarChars();
    renderSongs();

  } catch (err) {
    const splash = document.getElementById('splash');
    splash.querySelector('.spin').style.display = 'none';
    splash.querySelector('h2').textContent = 'Could not load library';
    document.getElementById('splash-msg').innerHTML =
      `<strong>${esc(err.message)}</strong><br><br>
       Serve over HTTP, not <code>file://</code>.<br>
       Run <code>python -m http.server</code> in the project folder,<br>
       then open <code>http://localhost:8000/player.html</code>`;
  }
}

// ── SORT & FILTER ──────────────────────────────────────────────────────────
const SORT_LABELS = {
  'title-asc':    'Title ↑',
  'title-desc':   'Title ↓',
  'musicId-asc':  'ID ↑',
  'musicId-desc': 'ID ↓',
  'released-asc': 'Oldest',
  'released-desc':'Newest',
  'folder-asc':   'Folder ↑',
  'folder-desc':  'Folder ↓',
};

function sortAndFilter() {
  let list = [...S.songs];
  const d = S.sortDir === 'asc' ? 1 : -1;

  if (S.sortBy === 'title')    list.sort((a,b) => d * a.title.localeCompare(b.title));
  if (S.sortBy === 'musicId')  list.sort((a,b) => d * (a.musicId - b.musicId));
  if (S.sortBy === 'released') list.sort((a,b) => d * (a.releasedAt - b.releasedAt));
  if (S.sortBy === 'folder')   list.sort((a,b) => d * (a.folder.localeCompare(b.folder) || a.title.localeCompare(b.title)));

  if (S.activeUnit !== 'all')  list = list.filter(s => s.folder === S.activeUnit);
  if (S.activeChars.size > 0) {
    if (S.onlyChosen) list = list.filter(s => s.charNames.length > 0 && s.charNames.every(n => S.activeChars.has(n)));
    else              list = list.filter(s => s.charNames.some(n => S.activeChars.has(n)));
  }
  if (S.searchQ) {
    const q = S.searchQ.toLowerCase();
    list = list.filter(s =>
      s.title.toLowerCase().includes(q) ||
      s.charNames.some(n => n.toLowerCase().includes(q)) ||
      s.folder.toLowerCase().includes(q) ||
      String(s.musicId).includes(q)
    );
  }
  S.filtered = list;
}

function refresh() { sortAndFilter(); renderSongs(); }

// ── SIDEBAR ────────────────────────────────────────────────────────────────
function renderSidebarUnits() {
  const counts = {};
  S.songs.forEach(s => { counts[s.folder] = (counts[s.folder]||0)+1; });
  const folders = [...new Set(S.songs.map(s => s.folder))].sort();

  document.getElementById('unit-filters').innerHTML =
    [['all','All songs', S.songs.length], ...folders.map(f => [f, unitLabel(f), counts[f]])]
    .map(([val, label, count]) =>
      `<div class="filter-item${S.activeUnit===val?' active':''} ${val!=='all'?'unit-'+val:''}" data-unit="${val}">
        <span>${esc(label)}</span><span class="count">${count}</span>
      </div>`
    ).join('');

  document.querySelectorAll('#unit-filters .filter-item').forEach(el =>
    el.addEventListener('click', () => {
      S.activeUnit = el.dataset.unit; S.activeChars.clear();
      refresh(); renderSidebarUnits(); renderSidebarChars();
    })
  );
}

function renderSidebarChars(query='') {
  const counts = {};
  S.songs.forEach(s => s.charNames.forEach(n => { counts[n] = (counts[n]||0)+1; }));
  let chars = Object.entries(counts).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
  if (query) { const q=query.toLowerCase(); chars = chars.filter(([n]) => n.toLowerCase().includes(q)); }

  const clearRow = S.activeChars.size > 0
    ? `<div class="filter-item clear-item" id="clear-chars"><span>Clear selection</span><span class="count">${S.activeChars.size}</span></div>`
    : '';

  document.getElementById('char-filters').innerHTML = clearRow + chars.map(([name, count]) =>
    `<div class="filter-item${S.activeChars.has(name)?' active':''}" data-char="${esc(name)}">
      <span>${esc(name)}</span><span class="count">${count}</span>
    </div>`
  ).join('');

  document.getElementById('clear-chars')?.addEventListener('click', () => {
    S.activeChars.clear(); refresh(); renderSidebarChars(document.getElementById('char-search').value);
  });
  document.querySelectorAll('#char-filters .filter-item[data-char]').forEach(el =>
    el.addEventListener('click', () => {
      const name = el.dataset.char;
      S.activeChars.has(name) ? S.activeChars.delete(name) : S.activeChars.add(name);
      refresh(); renderSidebarChars(document.getElementById('char-search').value);
    })
  );
}

document.getElementById('char-search').addEventListener('input', e => renderSidebarChars(e.target.value));
document.getElementById('only-chosen-btn').addEventListener('click', () => {
  S.onlyChosen = !S.onlyChosen;
  document.getElementById('only-chosen-btn').classList.toggle('active', S.onlyChosen);
  refresh();
});
document.getElementById('search').addEventListener('input', e => { S.searchQ = e.target.value; refresh(); });

// ── SORT DROPDOWN ──────────────────────────────────────────────────────────
const sortDisplay  = document.getElementById('sort-display');
const sortDropdown = document.getElementById('sort-dropdown');

sortDisplay.addEventListener('click', e => {
  e.stopPropagation();
  sortDisplay.classList.toggle('open');
  sortDropdown.classList.toggle('open');
});
document.addEventListener('click', () => {
  sortDisplay.classList.remove('open');
  sortDropdown.classList.remove('open');
});
sortDropdown.addEventListener('click', e => e.stopPropagation());

function updateSortLabel() {
  document.getElementById('sort-label').textContent = SORT_LABELS[`${S.sortBy}-${S.sortDir}`] || 'Sort';
  document.querySelectorAll('.sort-option').forEach(o => {
    o.classList.toggle('active', o.dataset.sort === S.sortBy && o.dataset.dir === S.sortDir);
  });
}

document.querySelectorAll('.sort-option').forEach(opt =>
  opt.addEventListener('click', () => {
    S.sortBy  = opt.dataset.sort;
    S.sortDir = opt.dataset.dir;
    updateSortLabel();
    sortDisplay.classList.remove('open');
    sortDropdown.classList.remove('open');
    refresh();
  })
);
updateSortLabel();

// ── VIEW TOGGLE ────────────────────────────────────────────────────────────
document.getElementById('view-list').addEventListener('click', () => setView('list'));
document.getElementById('view-grid').addEventListener('click', () => setView('grid'));

function setView(v) {
  S.view = v;
  document.getElementById('view-list').classList.toggle('active', v === 'list');
  document.getElementById('view-grid').classList.toggle('active', v === 'grid');
  renderSongs();
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function renderSongs() {
  const list = S.filtered;
  const parts = [`${list.length} song${list.length!==1?'s':''}`];
  if (S.activeUnit !== 'all') parts.push(unitLabel(S.activeUnit));
  if (S.activeChars.size === 1) parts.push([...S.activeChars][0]);
  else if (S.activeChars.size > 1) parts.push(`${S.activeChars.size} artists`);
  if (S.onlyChosen && S.activeChars.size > 0) parts.push('only chosen');
  document.getElementById('results-info').textContent = parts.join(' · ');

  const el = document.getElementById('song-list');

  if (!list.length) {
    el.className = '';
    el.innerHTML = '<div class="empty"><div class="icon">🎵</div><div>No songs found</div></div>';
    return;
  }

  if (S.view === 'grid') renderGrid(list, el);
  else                   renderList(list, el);
}

function renderList(list, el) {
  el.className = '';
  const currentId = S.currentIdx !== -1 ? S.songs[S.currentIdx]?.id : null;

  el.innerHTML = list.map((s, i) => {
    const playing  = s.id === currentId;
    const unitTag  = `<span class="tag unit unit-${s.folder}">${esc(unitLabel(s.folder))}</span>`;
    const capTag   = s.caption ? `<span class="tag">${esc(s.caption)}</span>` : '';
    const charTags = s.charNames.slice(0,4).map(n => `<span class="tag">${esc(n)}</span>`).join('');
    const jacket   = `<img class="row-jacket" src="${esc(s.jacketSrc)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                      <div class="row-jacket-placeholder" style="display:none">🎵</div>`;
    return `<div class="song-row${playing?' playing':''}" data-id="${s.id}">
      <div class="song-num">
        <span class="song-num-text">${i+1}</span>
        <div class="playing-anim">
          <div class="bar" style="height:4px"></div>
          <div class="bar" style="height:9px"></div>
          <div class="bar" style="height:3px"></div>
        </div>
      </div>
      ${jacket}
      <div class="song-info">
        <div class="song-title">${esc(s.title)}</div>
        <div class="song-meta">${unitTag}${capTag}${charTags}</div>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.song-row').forEach(row =>
    row.addEventListener('click', () => {
      const idx = S.songs.findIndex(s => s.id === row.dataset.id);
      if (idx !== -1) playSong(idx);
    })
  );
}

function renderGrid(list, el) {
  el.className = 'grid';
  const currentId = S.currentIdx !== -1 ? S.songs[S.currentIdx]?.id : null;

  el.innerHTML = list.map(s => {
    const playing  = s.id === currentId;
    const unitTag  = `<span class="tag unit unit-${s.folder}">${esc(unitLabel(s.folder))}</span>`;
    const capTag   = s.caption ? `<span class="tag">${esc(s.caption)}</span>` : '';
    const chars    = s.charNames.join(', ');
    return `<div class="song-card${playing?' playing':''}" data-id="${s.id}">
      <div class="card-jacket-wrap">
        <img class="card-jacket" src="${esc(s.jacketSrc)}" alt="" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="card-jacket-placeholder" style="display:none">🎵</div>
        <div class="card-play-overlay">
          <div class="card-play-icon">
            <span class="card-play-icon-default">▶</span>
            <div class="card-playing-anim">
              <div class="card-bar" style="height:5px"></div>
              <div class="card-bar" style="height:11px"></div>
              <div class="card-bar" style="height:4px"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-title">${esc(s.title)}</div>
        <div class="card-meta">${unitTag}${capTag}</div>
        ${chars ? `<div class="card-chars">${esc(chars)}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.song-card').forEach(card =>
    card.addEventListener('click', () => {
      const idx = S.songs.findIndex(s => s.id === card.dataset.id);
      if (idx !== -1) playSong(idx);
    })
  );
}

// ── PLAYBACK ───────────────────────────────────────────────────────────────
const audioEl    = document.getElementById('audio-el');
const progressEl = document.getElementById('progress');
let isSeeking    = false;

function playSong(idx) {
  if (idx < 0 || idx >= S.songs.length) return;
  S.currentIdx = idx;
  const song = S.songs[idx];
  audioEl.src = song.audioSrc;
  audioEl.volume = parseFloat(document.getElementById('volume').value);
  progressEl.value = 0;
  audioEl.play().catch(() => {});

  // Update now-playing bar
  document.getElementById('np-title').textContent = song.title;
  document.getElementById('np-sub').textContent =
    [song.caption, song.charNames.slice(0,4).join(', ')].filter(Boolean).join(' · ');

  // Jacket in player bar
  const npJacket = document.getElementById('np-jacket');
  const npJacketPh = document.getElementById('np-jacket-ph');
  npJacket.src = song.jacketSrc;
  npJacket.style.display = '';
  npJacketPh.style.display = 'none';
  npJacket.onerror = () => { npJacket.style.display = 'none'; npJacketPh.style.display = ''; };

  document.getElementById('player-bar').classList.remove('hidden');
  renderSongs();
}

audioEl.addEventListener('loadedmetadata', () => {
  document.getElementById('time-dur').textContent = fmt(audioEl.duration);
});
audioEl.addEventListener('timeupdate', () => {
  if (!audioEl.duration || isSeeking) return;
  progressEl.value = Math.round((audioEl.currentTime / audioEl.duration) * 1000);
  document.getElementById('time-cur').textContent = fmt(audioEl.currentTime);
});
audioEl.addEventListener('ended', playNext);
audioEl.addEventListener('play',  () => { document.getElementById('btn-play').innerHTML = '&#9646;&#9646;'; });
audioEl.addEventListener('pause', () => { document.getElementById('btn-play').innerHTML = '&#9654;'; });

progressEl.addEventListener('mousedown',  () => { isSeeking = true; });
progressEl.addEventListener('touchstart', () => { isSeeking = true; }, { passive: true });
progressEl.addEventListener('input', () => {
  if (audioEl.duration) document.getElementById('time-cur').textContent = fmt((progressEl.value / 1000) * audioEl.duration);
});
progressEl.addEventListener('mouseup',  commitSeek);
progressEl.addEventListener('touchend', commitSeek);
progressEl.addEventListener('change',   commitSeek);
function commitSeek() { isSeeking = false; if (audioEl.duration) audioEl.currentTime = (progressEl.value / 1000) * audioEl.duration; }

document.getElementById('btn-play').addEventListener('click', () => {
  if (S.currentIdx === -1 && S.songs.length) { playSong(0); return; }
  audioEl.paused ? audioEl.play() : audioEl.pause();
});
document.getElementById('btn-prev').addEventListener('click', () => {
  if (audioEl.currentTime > 3) audioEl.currentTime = 0;
  else playSong((S.currentIdx - 1 + S.songs.length) % S.songs.length);
});
document.getElementById('btn-next').addEventListener('click', playNext);
document.getElementById('btn-shuffle').addEventListener('click', () => {
  S.shuffle = !S.shuffle;
  document.getElementById('btn-shuffle').classList.toggle('shuffle-on', S.shuffle);
  if (S.shuffle) buildShuffleOrder();
});
document.getElementById('volume').addEventListener('input', e => { audioEl.volume = e.target.value; });

function buildShuffleOrder() {
  const arr = S.songs.map((_,i) => i);
  for (let i = arr.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  S.shuffleOrder = arr;
}
function playNext() {
  if (S.shuffle) { if (!S.shuffleOrder.length) buildShuffleOrder(); playSong(S.shuffleOrder.pop()); }
  else playSong((S.currentIdx + 1) % S.songs.length);
}

  document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
});
document.getElementById('palette-btn').addEventListener('click', e => {
  e.stopPropagation(); document.getElementById('theme-panel').classList.toggle('open');
});
document.addEventListener('click', () => document.getElementById('theme-panel').classList.remove('open'));
document.getElementById('theme-panel').addEventListener('click', e => e.stopPropagation());
document.querySelectorAll('.swatch').forEach(sw => sw.addEventListener('click', () => {
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  sw.classList.add('active'); document.body.dataset.accent = sw.dataset.v;
}));
