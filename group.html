<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player Sekai</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<script type="importmap">
    {
        "imports": {
            "@material/web/": "https://esm.run/@material/web/"
        }
    }
</script>

<script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
</script>

<style>
:root {
    --md-sys-color-primary: #ebddfe;
    --md-sys-color-on-primary: #4e368b;
    --md-sys-color-background: #beabf5;
    --md-sys-color-on-background: #4f3a7a;
    --md-sys-color-surface: #e3e1f9;
    --md-sys-color-on-surface: #4f3a7a;
    --md-divider-color: #a08cd9;
}

body {
    margin: 0;
    display: flex;
    height: 100vh;
    font-family: Roboto, sans-serif;
    background: var(--md-sys-color-background);
    color: var(--md-sys-color-on-background);
    overflow: hidden;
}

.sidebar {
    width: 250px;
    padding-left: 20px;
    padding-right: 20px;
    border-right: 2px solid #a08cd9;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.header {
    padding-left: 20px;
}

md-list {
    padding: 0;
}

md-list-item {
    cursor: pointer;
}

md-list-item:hover, md-list-item:focus {
    background: #d6cff5;
}

md-divider {
    --md-divider-color: #a08cd9;
}

.player {
    padding: 10px;
    background: #4f3a7a;
}

audio {
    width: 100%;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
    margin: 0 20px 20px 20px;
    flex: 1;
}

md-card {
  border-radius: 24px;
  overflow: auto;
  background: #d6cff5;
}

.card {
    background: var(--md-sys-color-surface);
    border-radius: 28px;
    margin: 0 20px 20px 20px;
    overflow: auto;
    flex: 1;
}

.card-img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

.content {
  padding: 8px;
  padding-left: 16px;
}
</style>
</head>

<body>

<div class="sidebar">
    <h1 class="md-typescale-display-medium">Pocket</h1>
    <div class="card">
        <md-list>
            <md-list-item href="index.html">Home</md-list-item>
            <md-divider inset></md-divider>
            <md-list-item href="group.html">Group</md-list-item>
            <md-list-item href="group.html?group=ln">Leo/need</md-list-item>
            <md-list-item href="group.html?group=mmj">MORE MORE JUMP</md-list-item>
            <md-list-item href="group.html?group=vbs">Vivid BAD SQUAD</md-list-item>
            <md-list-item href="group.html?group=wxs">Wonderlands x Showtime</md-list-item>
            <md-list-item href="group.html?group=n25">Nightcord</md-list-item>
        </md-list>
    </div>
</div>

<div class="main">
    <div class="header">
        <h1 class="md-typescale-display-medium">Group List</h1>
    </div>

    <div class="grid">
        <md-card href="group/leoneed">
            <img class="card-img" src="image/ln.webp">
            <div class="content">
            <div class="title">Leo/Need</div>
            <div class="subtitle">30 Songs</div>
            </div>
        </md-card>

        <md-card>
            <img class="card-img" src="image/mmj.webp">
            <div class="content">
            <div class="title">More More Jump</div>
            <div class="subtitle">27 Songs</div>
            </div>
        </md-card>

        <md-card>
            <img class="card-img" src="image/vbs.webp">
            <div class="content">
            <div class="title">Viva Bad Squad</div>
            <div class="subtitle">27 Songs</div>
            </div>
        </md-card>

        <md-card>
            <img class="card-img" src="image/wxs.webp">
            <div class="content">
            <div class="title">Wonderland X Showtime</div>
            <div class="subtitle">27 Songs</div>
            </div>
        </md-card>

        <md-card>
            <img class="card-img" src="image/n25.webp">
            <div class="content">
            <div class="title">Nightchord at 25</div>
            <div class="subtitle">27 Songs</div>
            </div>
        </md-card>
    </div>

    <!-- <div class="card">
        <md-list id="songList"></md-list>
    </div> -->

    <div class="player">
        <audio id="player" controls></audio>
    </div>
</div>



</body>
</html>
